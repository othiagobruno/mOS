name: linux-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependências
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 curl xz-utils
      - name: zig 0.17.1
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          echo /opt/zig-x86_64-linux-0.17.1 >> "$GITHUB_PATH"
      - name: teste de host da contagem Swift
        run: gcc -O2 -Wall -Wextra -pthread -o /tmp/swift_refcount_host tools/swift_refcount_host.c userland/libsystem/swift_refcount.c && /tmp/swift_refcount_host
      - name: testes de unwind no host
        run: tools/cxx_unwind_host.sh
      - name: tools/build.sh
        run: tools/build.sh --out /tmp/mos-linux-build
      - name: hosttest do gate
        run: python3 tools/corpus/harness.py hosttest --lib /tmp/mos-linux-build/libSystem.mos --disco /tmp/mos-linux-build/libunwind-x86
      - name: teste de host do Virtualization
        run: sh tools/test-vz.sh
